[project]
name = "reqdb"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "dcfSec", email = "contributor@dcfsec.com" }]
requires-python = ">=3.13,<4.0"
dependencies = [
    "requests>=2.32.4,<3.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "pyodbc>=5.2.0,<6.0.0",
    "psycopg2-binary>=2.9.10,<3.0.0",
    "fastapi>=0.165.0",
    "fastapi-cli>=0.0.34",
    "sqlmodel>=0.0.50",
    "authlib>=1.4.0,<2.0.0",
    "httpx2>=2.0.0",
    "itsdangerous>=2.2.0,<3.0.0",
    "alembic>=1.14.1,<2.0.0",
    "redis>=8.1.0,<9.0.0",
    "joserfc>=1.2.2,<2.0.0",
    "starlette>=1.0.1,<2.0.0",
]

[tool.poetry]
package-mode = false

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
